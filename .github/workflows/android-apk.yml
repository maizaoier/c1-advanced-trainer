name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Every APK MUST be signed with the same key, otherwise Android refuses to update the app.
      # If the secret KEYSTORE_BASE64 exists it is used; otherwise the keystore in signing/.
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'c1trainer-oier' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: npx cap add android && npx cap sync android
      - name: Set version (each build is newer than the last)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build release APK (unsigned)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign with the fixed key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > ks.p12; else cp signing/c1trainer.p12 ks.p12; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias c1trainer --key-pass env:KS_PASS --out C1-Trainer.apk aligned.apk
          $BT/apksigner verify --print-certs C1-Trainer.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: C1-Trainer-apk
          path: C1-Trainer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: C1 Trainer v1.0.${{ github.run_number }}
          body: |
            APK para Android (Pixel 9). Descárgalo desde el móvil y ábrelo para instalarlo encima de la versión anterior.
            Desde la v1.0.4 todas las versiones van firmadas con la misma clave, así que se actualizan sin desinstalar.
          files: C1-Trainer.apk
          make_latest: true
