name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk C1-Trainer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: C1-Trainer-apk
          path: C1-Trainer.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: C1 Trainer v1.0.${{ github.run_number }}
          body: |
            APK para Android (Pixel 9). Descárgalo desde el móvil y ábrelo para instalarlo.
            Si Android lo bloquea, permite «Instalar apps desconocidas» para el navegador.
          files: C1-Trainer.apk
          make_latest: true
